<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hollow Knight Mini - Nightmare King Grimm</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #050308;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            box-shadow: 0 0 30px rgba(180, 20, 40, 0.4);
            border: 2px solid #331018;
            border-radius: 8px;
            overflow: hidden;
        }
        canvas {
            background: linear-gradient(to bottom, #0a040d, #1b0a1a, #0d050e);
            display: block;
        }
        #ui-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            pointer-events: none;
        }
        .hud-panel {
            background: rgba(10, 5, 12, 0.7);
            padding: 12px 18px;
            border-radius: 6px;
            border: 1px solid #4a1525;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .hp-masks {
            display: flex;
            gap: 8px;
            margin-top: 6px;
        }
        .mask {
            width: 20px;
            height: 26px;
            background: #e6e6e6;
            border-radius: 50% 50% 40% 40%;
            border: 2px solid #111;
            box-shadow: 0 0 8px rgba(255,255,255,0.8);
            transition: all 0.2s;
        }
        .mask.lost {
            background: #222;
            border-color: #444;
            box-shadow: none;
            opacity: 0.3;
        }
        .boss-hud {
            width: 320px;
            text-align: center;
            opacity: 0;
            transition: opacity 0.5s;
        }
        .boss-hud.active {
            opacity: 1;
        }
        .boss-name {
            color: #ff334b;
            font-weight: bold;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(255, 51, 75, 0.8);
            margin-bottom: 6px;
            font-size: 14px;
        }
        .boss-hp-bar {
            width: 100%;
            height: 14px;
            background: #1a050a;
            border: 1px solid #801825;
            border-radius: 7px;
            overflow: hidden;
            padding: 2px;
        }
        .boss-hp-fill {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #990012, #ff334b);
            border-radius: 4px;
            transition: width 0.1s linear;
        }
        .controls-hint {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            color: #887788;
            font-size: 13px;
            letter-spacing: 1px;
            pointer-events: none;
            background: rgba(0,0,0,0.5);
            padding: 4px 12px;
            border-radius: 12px;
        }
        #game-over, #victory {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 2, 8, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.8s;
        }
        #game-over.show, #victory.show {
            opacity: 1;
            pointer-events: auto;
        }
        h1 {
            font-size: 42px;
            margin-bottom: 10px;
            letter-spacing: 3px;
        }
        #game-over h1 { color: #cc2233; text-shadow: 0 0 15px rgba(204, 34, 51, 0.6); }
        #victory h1 { color: #ffbb33; text-shadow: 0 0 15px rgba(255, 187, 51, 0.6); }
        .btn {
            margin-top: 20px;
            padding: 10px 24px;
            background: #2b0c16;
            color: #ffcccc;
            border: 1px solid #772233;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn:hover {
            background: #55182b;
            color: #ffffff;
            box-shadow: 0 0 12px rgba(255, 51, 75, 0.5);
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="canvas" width="900" height="500"></canvas>
    
    <div id="ui-overlay">
        <div class="hud-panel">
            <div style="font-size: 12px; color: #aaa; font-weight: bold;">KNIGHT</div>
            <div class="hp-masks" id="masks-container"></div>
        </div>
        
        <div class="boss-hud" id="boss-hud">
            <div class="boss-name">NIGHTMARE KING GRIMM</div>
            <div class="boss-hp-bar">
                <div class="boss-hp-fill" id="boss-hp-fill"></div>
            </div>
        </div>
    </div>

    <div class="controls-hint">
        이동: [A][D] | 점프: [W] / [Space] | 공격: [J] / [Z] | 대시: [K] / [Shift]
    </div>

    <div id="game-over">
        <h1>SURRENDER TO THE NIGHTMARE</h1>
        <p style="color: #aa8899;">그림의 악몽에 사로잡혔습니다.</p>
        <button class="btn" onclick="resetGame()">다시 도전</button>
    </div>

    <div id="victory">
        <h1>NIGHTMARE VANQUISHED</h1>
        <p style="color: #ffddaa;">악몽의 왕 그림을 물리쳤습니다!</p>
        <button class="btn" onclick="resetGame()">다시 플레이</button>
    </div>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

// --- 게임 상태 및 설정 ---
const GAME_WIDTH = canvas.width;
const GAME_HEIGHT = canvas.height;
const GROUND_Y = GAME_HEIGHT - 60;

let keys = {};
let particles = [];
let gameTime = 0;
let isGameOver = false;
let isVictory = false;

// --- 플레이어 객체 ---
const player = {
    x: 100,
    y: GROUND_Y - 40,
    width: 24,
    height: 38,
    vx: 0,
    vy: 0,
    speed: 5.5,
    jumpPower: -12.5,
    isGrounded: false,
    facing: 1, // 1: 우, -1: 좌
    
    // 체력
    maxHp: 5,
    hp: 5,
    invulnerableTimer: 0,
    
    // 공격
    isAttacking: false,
    attackTimer: 0,
    attackCooldown: 0,
    attackBox: { x: 0, y: 0, width: 45, height: 40 },
    
    // 대시
    isDashing: false,
    dashTimer: 0,
    dashCooldown: 0,
    dashSpeed: 14,
    dashDuration: 12,
    
    reset() {
        this.x = 100;
        this.y = GROUND_Y - this.height;
        this.vx = 0;
        this.vy = 0;
        this.hp = this.maxHp;
        this.invulnerableTimer = 0;
        this.isAttacking = false;
        this.isDashing = false;
        this.dashCooldown = 0;
        this.facing = 1;
        updateHpUI();
    },

    takeDamage(amount) {
        if (this.invulnerableTimer > 0 || this.isDashing) return;
        this.hp -= amount;
        this.invulnerableTimer = 60; // 약 1초 무적
        this.vy = -6;
        this.vx = -this.facing * 5;
        createParticles(this.x + this.width/2, this.y + this.height/2, '#ff334b', 15);
        updateHpUI();
        
        if (this.hp <= 0) {
            triggerGameOver();
        }
    },

    update() {
        // 무적 타임 감소
        if (this.invulnerableTimer > 0) this.invulnerableTimer--;

        // 대시 처리
        if (this.dashCooldown > 0) this.dashCooldown--;
        
        if (this.isDashing) {
            this.dashTimer--;
            this.vy = 0; // 대시 중 중력 무시
            this.vx = this.facing * this.dashSpeed;
            createParticles(this.x + (this.facing > 0 ? 0 : this.width), this.y + Math.random()*this.height, '#ffffff', 1, 0.5);
            
            if (this.dashTimer <= 0) {
                this.isDashing = false;
                this.vx = 0;
            }
        } else {
            // 일반 좌우 이동
            if (keys['a'] || keys['A'] || keys['ArrowLeft']) {
                this.vx = -this.speed;
                this.facing = -1;
            } else if (keys['d'] || keys['D'] || keys['ArrowRight']) {
                this.vx = this.speed;
                this.facing = 1;
            } else {
                this.vx *= 0.7; // 감속
            }

            // 중력 적용
            this.vy += 0.65;
        }

        // 위치 업데이트
        this.x += this.vx;
        this.y += this.vy;

        // 벽 & 바닥 충돌 처리
        if (this.x < 20) this.x = 20;
        if (this.x + this.width > GAME_WIDTH - 20) this.x = GAME_WIDTH - 20 - this.width;

        if (this.y + this.height >= GROUND_Y) {
            this.y = GROUND_Y - this.height;
            this.vy = 0;
            this.isGrounded = true;
        } else {
            this.isGrounded = false;
        }

        // 공격 처리
        if (this.attackCooldown > 0) this.attackCooldown--;
        if (this.isAttacking) {
            this.attackTimer--;
            if (this.attackTimer <= 0) {
                this.isAttacking = false;
            }
        }

        // 공격 판정 위치 계산
        this.attackBox.x = this.facing === 1 ? this.x + this.width : this.x - this.attackBox.width;
        this.attackBox.y = this.y - 4;
    },

    draw() {
        // 무적 시 깜빡임
        if (this.invulnerableTimer % 4 >= 2) return;

        ctx.save();
        
        // 잔상 효과 (대시 중)
        if (this.isDashing) {
            ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
            ctx.fillRect(this.x - this.vx*2, this.y, this.width, this.height);
        }

        // 케이프 (망토)
        ctx.fillStyle = '#3a3a4e';
        ctx.beginPath();
        ctx.moveTo(this.x + this.width/2, this.y + 12);
        ctx.lineTo(this.x + (this.facing === 1 ? -6 : this.width + 6), this.y + this.height);
        ctx.lineTo(this.x + this.width/2, this.y + this.height - 4);
        ctx.fill();

        // 캐릭터 몸체
        ctx.fillStyle = '#1e1e24';
        ctx.fillRect(this.x + 4, this.y + 14, this.width - 8, this.height - 14);

        // 머리 (할로우나이트 가면)
        ctx.fillStyle = '#e6e6e8';
        ctx.beginPath();
        ctx.ellipse(this.x + this.width/2, this.y + 10, 12, 11, 0, 0, Math.PI * 2);
        ctx.fill();

        // 뿔 2개
        ctx.beginPath();
        ctx.moveTo(this.x + 4, this.y + 5);
        ctx.lineTo(this.x, this.y - 8);
        ctx.lineTo(this.x + 9, this.y + 3);
        ctx.fill();

        ctx.beginPath();
        ctx.moveTo(this.x + this.width - 4, this.y + 5);
        ctx.lineTo(this.x + this.width, this.y - 8);
        ctx.lineTo(this.x + this.width - 9, this.y + 3);
        ctx.fill();

        // 검은 눈 2개
        ctx.fillStyle = '#09090b';
        const eyeOffset = this.facing === 1 ? 2 : -2;
        ctx.beginPath();
        ctx.ellipse(this.x + 8 + eyeOffset, this.y + 10, 3, 5, 0.1, 0, Math.PI * 2);
        ctx.ellipse(this.x + 16 + eyeOffset, this.y + 10, 3, 5, -0.1, 0, Math.PI * 2);
        ctx.fill();

        // 공격 이펙트 (검기)
        if (this.isAttacking) {
            ctx.strokeStyle = '#e0f7fa';
            ctx.lineWidth = 4;
            ctx.shadowBlur = 10;
            ctx.shadowColor = '#80deea';
            ctx.beginPath();
            
            const swingProgress = (12 - this.attackTimer) / 12;
            const startAngle = this.facing === 1 ? -Math.PI/3 : Math.PI * 4/3;
            const endAngle = this.facing === 1 ? Math.PI/3 : Math.PI * 2/3;
            const currentAngle = startAngle + (endAngle - startAngle) * swingProgress;

            ctx.arc(
                this.x + this.width/2, 
                this.y + this.height/2, 
                42, 
                startAngle, 
                currentAngle, 
                this.facing === -1
            );
            ctx.stroke();
            ctx.shadowBlur = 0;
        }

        ctx.restore();
    }
};

// --- 일반 몹 클래스 (그림 신도/잡몹) ---
class Mob {
    constructor(x, y, type) {
        this.x = x;
        this.y = y;
        this.width = 28;
        this.height = 32;
        this.type = type; // 'crawler' or 'flyer'
        this.hp = 3;
        this.vx = type === 'crawler' ? (Math.random() > 0.5 ? 2 : -2) : 1.5;
        this.vy = 0;
        this.floatAngle = Math.random() * Math.PI * 2;
        this.markedForDeath = false;
        this.flashTimer = 0;
    }

    update() {
        if (this.flashTimer > 0) this.flashTimer--;

        if (this.type === 'crawler') {
            this.x += this.vx;
            if (this.x < 30 || this.x > GAME_WIDTH - 50) this.vx *= -1;
            this.y = GROUND_Y - this.height;
        } else if (this.type === 'flyer') {
            this.floatAngle += 0.05;
            this.x += Math.cos(this.floatAngle) * this.vx;
            this.y += Math.sin(this.floatAngle * 1.5) * 1.5;
            
            if (this.x < 40 || this.x > GAME_WIDTH - 60) this.vx *= -1;
        }

        // 플레이어와 충돌 판정
        if (checkCollision(this, player)) {
            player.takeDamage(1);
        }

        // 플레이어 공격 맞음 판정
        if (player.isAttacking && checkCollision(this, player.attackBox)) {
            if (this.flashTimer === 0) {
                this.hp--;
                this.flashTimer = 10;
                this.x += player.facing * 12; // 넉백
                createParticles(this.x + this.width/2, this.y + this.height/2, '#ff1a3c', 8);
                if (this.hp <= 0) this.markedForDeath = true;
            }
        }
    }

    draw() {
        ctx.save();
        ctx.fillStyle = this.flashTimer > 0 ? '#ffffff' : '#4a0e17';
        
        // 박쥐/신도 형태
        ctx.beginPath();
        ctx.arc(this.x + this.width/2, this.y + 12, 12, 0, Math.PI * 2);
        ctx.fill();

        // 붉은 눈
        ctx.fillStyle = '#ff0033';
        ctx.fillRect(this.x + 8, this.y + 10, 3, 3);
        ctx.fillRect(this.x + 17, this.y + 10, 3, 3);

        // 날개/옷자락
        ctx.fillStyle = '#7a1426';
        ctx.beginPath();
        ctx.moveTo(this.x + 2, this.y + 14);
        ctx.lineTo(this.x - 8, this.y + 26);
        ctx.lineTo(this.x + 10, this.y + 22);
        ctx.fill();

        ctx.beginPath();
        ctx.moveTo(this.x + this.width - 2, this.y + 14);
        ctx.lineTo(this.x + this.width + 8, this.y + 26);
        ctx.lineTo(this.x + this.width - 10, this.y + 22);
        ctx.fill();

        ctx.restore();
    }
}

// --- 보스: 악몽의 왕 그림 (Nightmare King Grimm) ---
const boss = {
    x: 650,
    y: GROUND_Y - 100,
    width: 50,
    height: 90,
    maxHp: 60,
    hp: 60,
    state: 'IDLE', // IDLE, DASH_ATTACK, FIREBALLS, TELEPORT, FIRE_PILLARS
    timer: 0,
    facing: -1,
    flashTimer: 0,
    projectiles: [],
    firePillars: [],

    reset() {
        this.x = 650;
        this.y = GROUND_Y - this.height;
        this.hp = this.maxHp;
        this.state = 'IDLE';
        this.timer = 60;
        this.projectiles = [];
        this.firePillars = [];
        updateBossUI();
    },

    takeDamage(amount) {
        if (this.flashTimer > 0 || this.state === 'TELEPORT') return;
        this.hp -= amount;
        this.flashTimer = 8;
        createParticles(this.x + this.width/2, this.y + this.height/2, '#ff0033', 10);
        updateBossUI();

        if (this.hp <= 0) {
            triggerVictory();
        }
    },

    update() {
        if (this.flashTimer > 0) this.flashTimer--;
        this.timer--;

        // 플레이어 바라보기 (텔레포트 중 제외)
        if (this.state !== 'TELEPORT') {
            this.facing = player.x < this.x ? -1 : 1;
        }

        // 보스 AI 상태 머신
        if (this.timer <= 0) {
            this.chooseNextPattern();
        }

        // 패턴별 행동 실행
        switch(this.state) {
            case 'DASH_ATTACK':
                this.x += this.facing * 11;
                createParticles(this.x + this.width/2, this.y + this.height, '#ff2244', 2);
                if (Math.abs(this.x - player.x) < 40 && Math.random() < 0.3) {
                    // 상향 급상승 공격 연계
                    this.y -= 8;
                }
                break;

            case 'FIREBALLS':
                // 투사체 3개 발사 패턴
                if (this.timer === 40 || this.timer === 25 || this.timer === 10) {
                    this.projectiles.push({
                        x: this.x + (this.facing === 1 ? this.width : 0),
                        y: this.y + 30,
                        vx: this.facing * 7,
                        vy: (Math.random() - 0.5) * 2,
                        radius: 10
                    });
                }
                break;

            case 'FIRE_PILLARS':
                // 바닥에서 불기둥 생성
                if (this.timer % 15 === 0 && this.timer > 20) {
                    this.firePillars.push({
                        x: player.x,
                        y: GROUND_Y,
                        width: 30,
                        height: 0,
                        maxHeight: 220,
                        warningTimer: 25,
                        activeTimer: 30
                    });
                }
                break;
        }

        // 보스 본체 - 플레이어 충돌 판정
        if (this.state !== 'TELEPORT' && checkCollision(this, player)) {
            player.takeDamage(1);
        }

        // 플레이어 공격 받기
        if (player.isAttacking && checkCollision(this, player.attackBox)) {
            this.takeDamage(1);
        }

        // 투사체 업뎃 & 충돌
        for (let i = this.projectiles.length - 1; i >= 0; i--) {
            let p = this.projectiles[i];
            p.x += p.vx;
            p.y += p.vy;

            // 플레이어와 충돌
            let dist = Math.hypot((player.x + player.width/2) - p.x, (player.y + player.height/2) - p.y);
            if (dist < p.radius + 12) {
                player.takeDamage(1);
                this.projectiles.splice(i, 1);
                continue;
            }

            // 화면 밖 제거
            if (p.x < 0 || p.x > GAME_WIDTH) {
                this.projectiles.splice(i, 1);
            }
        }

        // 불기둥 업뎃 & 충돌
        for (let i = this.firePillars.length - 1; i >= 0; i--) {
            let fp = this.firePillars[i];
            if (fp.warningTimer > 0) {
                fp.warningTimer--;
            } else if (fp.activeTimer > 0) {
                fp.activeTimer--;
                if (fp.height < fp.maxHeight) fp.height += 20;

                // 불기둥 충돌 판정
                if (player.x + player.width > fp.x - fp.width/2 &&
                    player.x < fp.x + fp.width/2 &&
                    player.y + player.height > GROUND_Y - fp.height) {
                    player.takeDamage(1);
                }
            } else {
                this.firePillars.splice(i, 1);
            }
        }
    },

    chooseNextPattern() {
        const patterns = ['DASH_ATTACK', 'FIREBALLS', 'FIRE_PILLARS', 'TELEPORT'];
        this.state = patterns[Math.floor(Math.random() * patterns.length)];

        switch (this.state) {
            case 'DASH_ATTACK':
                this.timer = 45;
                this.y = GROUND_Y - this.height;
                // 플레이어 약간 뒤쪽/앞쪽으로 텔레포트 후 돌진
                this.x = player.x + (Math.random() > 0.5 ? 250 : -250);
                this.x = Math.max(50, Math.min(GAME_WIDTH - 100, this.x));
                break;
            case 'FIREBALLS':
                this.timer = 50;
                this.y = GROUND_Y - this.height - 20;
                this.x = this.facing === 1 ? 100 : GAME_WIDTH - 150;
                break;
            case 'FIRE_PILLARS':
                this.timer = 85;
                this.x = GAME_WIDTH / 2 - this.width / 2;
                this.y = GROUND_Y - this.height - 120; // 공중 부양
                break;
            case 'TELEPORT':
                this.timer = 20;
                createParticles(this.x + this.width/2, this.y + this.height/2, '#ff1a3c', 20);
                this.x = Math.random() * (GAME_WIDTH - 200) + 100;
                this.y = GROUND_Y - this.height;
                break;
        }
    },

    draw() {
        if (this.state === 'TELEPORT' && this.timer < 15) return;

        ctx.save();
        
        // 피격 효과
        ctx.fillStyle = this.flashTimer > 0 ? '#ffffff' : '#e60026';

        // 그림 보스 외형 (악몽의 왕 특유의 붉은 망토와 가느다란 몸)
        // 붉은 롱 망토
        ctx.beginPath();
        ctx.moveTo(this.x + this.width/2, this.y);
        ctx.lineTo(this.x - (this.facing * 35), this.y + this.height + 10);
        ctx.lineTo(this.x + this.width/2, this.y + this.height);
        ctx.lineTo(this.x + this.width + (this.facing * 35), this.y + this.height + 10);
        ctx.closePath();
        ctx.fill();

        // 흑색 칼라/몸체
        ctx.fillStyle = '#110507';
        ctx.fillRect(this.x + 12, this.y + 25, this.width - 24, this.height - 25);

        // 가면 (얼굴)
        ctx.fillStyle = '#f0e6e6';
        ctx.beginPath();
        ctx.ellipse(this.x + this.width/2, this.y + 18, 14, 18, 0, 0, Math.PI * 2);
        ctx.fill();

        // 악마 형태 눈 (붉은 빛)
        ctx.fillStyle = '#ff002b';
        ctx.shadowBlur = 8;
        ctx.shadowColor = '#ff002b';
        ctx.beginPath();
        ctx.arc(this.x + this.width/2 - 6 * this.facing, this.y + 18, 4, 0, Math.PI * 2);
        ctx.arc(this.x + this.width/2 + 6 * this.facing, this.y + 18, 4, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;

        // 발사체 그리기
        ctx.fillStyle = '#ff334b';
        ctx.shadowBlur = 12;
        ctx.shadowColor = '#ff0033';
        this.projectiles.forEach(p => {
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
            ctx.fill();
        });

        // 불기둥 그리기
        this.firePillars.forEach(fp => {
            if (fp.warningTimer > 0) {
                // 바닥 경고선
                ctx.fillStyle = 'rgba(255, 0, 50, 0.4)';
                ctx.fillRect(fp.x - fp.width/2, GROUND_Y - 4, fp.width, 4);
            } else {
                // 솟아오르는 불기둥
                let grad = ctx.createLinearGradient(0, GROUND_Y, 0, GROUND_Y - fp.height);
                grad.addColorStop(0, '#ff0033');
                grad.addColorStop(0.5, '#ff6600');
                grad.addColorStop(1, 'transparent');
                ctx.fillStyle = grad;
                ctx.fillRect(fp.x - fp.width/2, GROUND_Y - fp.height, fp.width, fp.height);
            }
        });

        ctx.restore();
    }
};

// --- 일반 몹 리스트 관리 ---
let mobs = [];

function spawnMobs() {
    mobs = [
        new Mob(250, GROUND_Y - 32, 'crawler'),
        new Mob(500, GROUND_Y - 32, 'crawler'),
        new Mob(350, 220, 'flyer'),
        new Mob(700, 180, 'flyer')
    ];
}

// --- 파티클 시스템 ---
function createParticles(x, y, color, count, speedMultiplier = 1) {
    for (let i = 0; i < count; i++) {
        particles.push({
            x: x,
            y: y,
            vx: (Math.random() - 0.5) * 6 * speedMultiplier,
            vy: (Math.random() - 0.5) * 6 * speedMultiplier,
            size: Math.random() * 4 + 2,
            color: color,
            life: 25
        });
    }
}

function updateParticles() {
    for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life--;
        if (p.life <= 0) {
            particles.splice(i, 1);
        }
    }
}

function drawParticles() {
    particles.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.life / 25;
        ctx.fillRect(p.x, p.y, p.size, p.size);
    });
    ctx.globalAlpha = 1.0;
}

// --- AABB 충돌 검사 ---
function checkCollision(rect1, rect2) {
    return rect1.x < rect2.x + rect2.width &&
           rect1.x + rect1.width > rect2.x &&
           rect1.y < rect2.y + rect2.height &&
           rect1.y + rect1.height > rect2.y;
}

// --- UI 업데이트 ---
function initUI() {
    const container = document.getElementById('masks-container');
    container.innerHTML = '';
    for (let i = 0; i < player.maxHp; i++) {
        const mask = document.createElement('div');
        mask.className = 'mask';
        container.appendChild(mask);
    }
    document.getElementById('boss-hud').classList.add('active');
}

function updateHpUI() {
    const masks = document.querySelectorAll('.mask');
    masks.forEach((mask, index) => {
        if (index < player.hp) {
            mask.classList.remove('lost');
        } else {
            mask.classList.add('lost');
        }
    });
}

function updateBossUI() {
    const fill = document.getElementById('boss-hp-fill');
    const pct = Math.max(0, (boss.hp / boss.maxHp) * 100);
    fill.style.width = pct + '%';
}

function triggerGameOver() {
    isGameOver = true;
    document.getElementById('game-over').classList.add('show');
}

function triggerVictory() {
    isVictory = true;
    document.getElementById('victory').classList.add('show');
}

function resetGame() {
    isGameOver = false;
    isVictory = false;
    document.getElementById('game-over').classList.remove('show');
    document.getElementById('victory').classList.remove('show');
    player.reset();
    boss.reset();
    spawnMobs();
}

// --- 배경 및 맵 그리기 ---
function drawEnvironment() {
    // 배경 그리드/고딕 기둥
    ctx.fillStyle = '#140718';
    for (let i = 0; i < GAME_WIDTH; i += 120) {
        ctx.fillRect(i + 20, 0, 30, GAME_HEIGHT - 60);
    }

    // 바닥 (가시/고딕 분위기)
    ctx.fillStyle = '#1c0a13';
    ctx.fillRect(0, GROUND_Y, GAME_WIDTH, GAME_HEIGHT - GROUND_Y);
    ctx.strokeStyle = '#801825';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(0, GROUND_Y);
    ctx.lineTo(GAME_WIDTH, GROUND_Y);
    ctx.stroke();

    // 악몽 무대 전등 효과 (붉은 아우라)
    let grad = ctx.createRadialGradient(GAME_WIDTH/2, 100, 20, GAME_WIDTH/2, 100, 350);
    grad.addColorStop(0, 'rgba(255, 26, 60, 0.15)');
    grad.addColorStop(1, 'transparent');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);
}

// --- 키 입력을 위한 이벤트 리스너 ---
window.addEventListener('keydown', e => {
    keys[e.key] = true;

    if (isGameOver || isVictory) return;

    // 점프 (W / Space)
    if ((e.key === 'w' || e.key === 'W' || e.key === ' ') && player.isGrounded) {
        player.vy = player.jumpPower;
        createParticles(player.x + player.width/2, player.y + player.height, '#ffffff', 6);
    }

    // 공격 (J / Z)
    if ((e.key === 'j' || e.key === 'J' || e.key === 'z' || e.key === 'Z') && player.attackCooldown === 0) {
        player.isAttacking = true;
        player.attackTimer = 12;
        player.attackCooldown = 18;
    }

    // 대시 (K / Shift)
    if ((e.key === 'k' || e.key === 'K' || e.key === 'Shift') && player.dashCooldown === 0 && !player.isDashing) {
        player.isDashing = true;
        player.dashTimer = player.dashDuration;
        player.dashCooldown = 45; // 대시 쿨타임
    }
});

window.addEventListener('keyup', e => {
    keys[e.key] = false;
});

// --- 메인 게임 루프 ---
function gameLoop() {
    gameTime++;

    // 화면 지우기
    ctx.clearRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

    // 환경 그리기
    drawEnvironment();

    if (!isGameOver && !isVictory) {
        // 업데이트
        player.update();
        boss.update();

        for (let i = mobs.length - 1; i >= 0; i--) {
            mobs[i].update();
            if (mobs[i].markedForDeath) {
                mobs.splice(i, 1);
            }
        }

        updateParticles();
    }

    // 그리기
    mobs.forEach(mob => mob.draw());
    boss.draw();
    player.draw();
    drawParticles();

    requestAnimationFrame(gameLoop);
}

// 초기화 실행
initUI();
spawnMobs();
gameLoop();

</script>
